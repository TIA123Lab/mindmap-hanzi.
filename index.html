*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}

nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
button,select,input,textarea{font:inherit;color:var(--tx)}
nav button,.btn{border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.chip{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:2px 10px;margin:2px;cursor:pointer;font-size:18px}
.mut{color:var(--mut)}.hz{font-size:22px}
.lv{display:inline-block;font-size:11px;color:#fff;border-radius:6px;padding:0 6px;margin-right:4px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.map{width:100%;height:auto;max-height:78vh;display:block}
.map g.n{cursor:pointer}.map text{pointer-events:none}
.fc{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:6px;padding:20px}
.fc .big{font-size:64px;line-height:1.2}
.hidden{display:none}footer{text-align:center;color:var(--mut);font-size:12px;padding:16px}

.sw{text-align:center}
.swbox{position:relative;width:218px;height:218px;margin:8px auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);touch-action:none}
.swgrid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.swgrid line{stroke:var(--bd);stroke-width:.6;stroke-dasharray:3 3}
#swt{position:absolute;inset:0}#swt svg{display:block;touch-action:none}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.stp{width:58px;border:1px solid var(--bd);border-radius:8px;padding:2px;background:var(--card)}
.stp svg{width:100%;height:auto;display:block}
.stp path{fill:var(--bd)}.stp path.p{fill:var(--tx)}.stp path.c{fill:var(--ac)}
.stp small{display:block;font-size:10px;color:var(--mut)}
.stp.on{border-color:var(--ac)}
.swc.on{border-color:var(--ac)}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.slot{min-width:64px;min-height:72px;border:2px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:3px}
.slot.f{border-color:transparent}.slot.ok{border:2px solid var(--l2)}.slot.bad{border:2px solid var(--ac)}
.tile{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 12px;border:1px solid var(--bd);border-bottom-width:3px;border-radius:10px;background:var(--card);cursor:grab;touch-action:manipulation}
.tile .th{font-size:24px;line-height:1.2}.tile .tp{font-size:11px;color:var(--mut)}.tile:active{transform:translateY(1px)}

const LC={1:'var(--l1)',2:'var(--l2)',3:'var(--l3)',4:'var(--l4)',5:'var(--l5)'};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get('hsk_known',[])),imported=store.get('hsk_import',[]);
let words=[],idx={},byId={};
const CJK=/[\u3400-\u9fff]/;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function build(){words=[];for(const l in RAW)RAW[l].forEach((r,i)=>words.push({id:l+'-'+i,l:+l,s:r[0],t:r[1],p:r[2],e:r[3]}));imported.forEach(w=>words.push(w));
 idx={};byId={};words.forEach((w,i)=>{byId[w.id]=w;[...new Set([...w.s].filter(c=>CJK.test(c)))].forEach(c=>(idx[c]=idx[c]||[]).push(w))});
 for(const c in idx)idx[c].sort((a,b)=>a.l-b.l||a.s.length-b.s.length);
 document.getElementById('tot').textContent=words.length+' kata · '+Object.keys(idx).length+' hanzi · '+known.size+' hafal'}
const levels=()=>[...new Set(words.map(w=>w.l))].sort();
const saveK=()=>{store.set('hsk_known',[...known]);document.getElementById('tot').textContent=words.length+' kata · '+Object.keys(idx).length+' hanzi · '+known.size+' hafal'};
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const lvTag=l=>`<span class="lv" style="background:${LC[l]||'var(--l1)'}">HSK ${l}</span>`;
let tab='home',center='学',sel=null;
const tabs=[['home','Beranda'],['map','Mind Map'],['cards','Kartu'],['sent','Susun Kalimat'],['list','Daftar']];
function nav(){document.getElementById('nav').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'on':''}" data-t="${k}">${n}</button>`).join('')}
document.getElementById('nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};
function render(){nav();({home,map,cards,sent,list})[tab]()}
const app=()=>document.getElementById('app');
function chars(w){return [...w.s].filter(c=>CJK.test(c)).map(c=>`<span class="chip" data-c="${c}">${c}</span>`).join('')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){center=c.dataset.c;sel=null;tab='map';render();scrollTo(0,0)}});

function home(){const ls=levels();
 let h='<div class="grid">'+ls.map(l=>{const a=words.filter(w=>w.l===l),k=a.filter(w=>known.has(w.id)).length;return `<div class="card">${lvTag(l)}<div class="hz">${a.length} kata</div><div class="mut">${k} hafal · ${Math.round(k/a.length*100)}%</div><div class="bar"><i style="width:${k/a.length*100}%;background:${LC[l]}"></i></div></div>`}).join('')+'</div>';
 if(!ls.includes(1))h+='<div class="card">HSK 1 belum ada di data. Buka tab <b>Daftar</b> → Impor untuk menempelkan kosakata HSK 1.</div>';
 const top=Object.entries(idx).sort((a,b)=>b[1].length-a[1].length).slice(0,60);
 h+=`<div class="card"><b>Hanzi paling produktif</b><div class="mut">Tap hanzi untuk melihat mind map semua kata yang memuatnya.</div><div>${top.map(([c,a])=>`<span class="chip" data-c="${c}">${c}<small class="mut"> ${a.length}</small></span>`).join('')}</div></div>`;
 h+='<div class="row"><button class="btn pri" id="rnd">🎲 Acak hanzi</button><button class="btn" id="th">Tema terang/gelap</button><button class="btn" id="rs">Reset progres</button></div>';
 app().innerHTML=h;
 document.getElementById('rnd').onclick=()=>{const k=Object.keys(idx).filter(c=>idx[c].length>=3);center=k[Math.random()*k.length|0];sel=null;tab='map';render()};
 document.getElementById('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';render()};
 document.getElementById('rs').onclick=()=>{if(confirm('Hapus semua penanda hafal?')){known=new Set();saveK();render()}}}

function map(){const W=idx[center]||[],shown=W.slice(0,32);
 let h=`<div class="card row"><input type="search" id="q" placeholder="Ketik hanzi, mis. 学" style="width:130px" value=""><button class="btn pri" id="go">Lihat</button><button class="btn" id="rnd">🎲 Acak</button><span class="mut">${W.length} kata memuat <b class="hz">${center}</b></span></div>`;
 if(!W.length)h+='<div class="card mut">Hanzi ini tidak ada di kosakata.</div>'+swHtml(center);
 else{const inn=shown.slice(0,12),out=shown.slice(12),pos=[];
  inn.forEach((w,i)=>{const a=i/inn.length*6.283-1.57;pos.push([w,Math.cos(a)*135,Math.sin(a)*135])});
  out.forEach((w,i)=>{const a=i/out.length*6.283-1.57+.15;pos.push([w,Math.cos(a)*240,Math.sin(a)*240])});
  let s=`<svg class="map" viewBox="-310 -300 620 600">`;
  pos.forEach(([w,x,y])=>s+=`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="${LC[w.l]}" stroke-width="2" opacity=".5"/>`);
  s+=`<circle r="48" fill="var(--ac)"/><text y="16" text-anchor="middle" font-size="46" fill="#fff">${center}</text>`;
  pos.forEach(([w,x,y])=>{const wd=Math.max(60,w.s.length*20+22),k=known.has(w.id);
   s+=`<g class="n" data-w="${w.id}" transform="translate(${x},${y})"><rect x="${-wd/2}" y="-24" width="${wd}" height="48" rx="12" fill="var(--card)" stroke="${LC[w.l]}" stroke-width="${sel===w.id?4:2}"/><text y="3" text-anchor="middle" font-size="19" fill="var(--tx)">${esc(w.s)}</text><text y="18" text-anchor="middle" font-size="9" fill="var(--mut)">${esc(w.p.length>14?w.p.slice(0,13)+'…':w.p)}</text>${k?`<text x="${wd/2-4}" y="-14" font-size="12" text-anchor="end" fill="var(--l2)">✓</text>`:''}</g>`});
  h+=`<div class="card">${s}</svg><div class="mut">Warna: ${[1,2,3,4,5].map(lvTag).join('')}${W.length>32?` · peta menampilkan 32 pertama, semua ada di daftar bawah`:''}</div></div>`;
  if(sel&&byId[sel]){const w=byId[sel];h+=`<div class="card"><div class="hz">${esc(w.s)} ${w.t!==w.s?`<span class="mut">(${esc(w.t)})</span>`:''}</div><div>${lvTag(w.l)} <b>${esc(w.p)}</b> <button class="btn" data-sp="${esc(w.s)}">🔊</button></div><div>${esc(w.e)}</div><div style="margin:6px 0">Hanzi: ${chars(w)}</div><button class="btn ${known.has(w.id)?'':'pri'}" data-k="${w.id}">${known.has(w.id)?'Batal hafal':'✓ Sudah hafal'}</button></div>`}
  h+=swHtml(sel&&byId[sel]?byId[sel].s:center);
  h+=`<div class="card"><b>Semua kata dengan ${center}</b><table>${W.map(w=>`<tr data-w="${w.id}" style="cursor:pointer"><td>${lvTag(w.l)}</td><td class="hz">${esc(w.s)}</td><td>${esc(w.p)}</td><td>${esc(w.e)}</td></tr>`).join('')}</table></div>`}
 app().innerHTML=h;swInit(sel&&byId[sel]?byId[sel].s:center);
 const go=()=>{const m=[...document.getElementById('q').value].find(c=>CJK.test(c));if(m){center=m;sel=null;render()}};
 document.getElementById('go').onclick=go;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')go()};
 document.getElementById('rnd').onclick=()=>{const k=Object.keys(idx).filter(c=>idx[c].length>=3);center=k[Math.random()*k.length|0];sel=null;render()}}
document.addEventListener('click',e=>{const w=e.target.closest('[data-w]');if(w&&tab==='map'){sel=w.dataset.w;render();return}
 const k=e.target.closest('[data-k]');if(k){const id=k.dataset.k;known.has(id)?known.delete(id):known.add(id);saveK();render()}
 const s=e.target.closest('[data-sp]');if(s)speak(s.dataset.sp)});

let deck=[],flip=false,fo={lv:null,dir:'h',unk:true};
function cards(){const ls=levels();fo.lv=fo.lv||new Set(ls.filter(l=>l<=2||true).slice(0,1));
 let h=`<div class="card row">${ls.map(l=>`<label><input type="checkbox" data-fl="${l}" ${fo.lv.has(l)?'checked':''}> HSK ${l}</label>`).join('')}<select id="dir"><option value="h" ${fo.dir==='h'?'selected':''}>Hanzi → arti</option><option value="e" ${fo.dir==='e'?'selected':''}>Arti → hanzi</option><option value="ph" ${fo.dir==='ph'?'selected':''}>Pinyin + hanzi → arti</option><option value="p" ${fo.dir==='p'?'selected':''}>Pinyin → arti</option></select><label><input type="checkbox" id="unk" ${fo.unk?'checked':''}> hanya yang belum hafal</label><button class="btn pri" id="st">Mulai / Acak</button></div>`;
 if(!deck.length)h+='<div class="card mut">Pilih level lalu tekan Mulai. Tombol Ingat menandai kata sebagai hafal; Lupa memutar kartu ke belakang antrean.</div>';
  else{const w=byId[deck[0]];const hz=`<div class="big">${esc(w.s)}</div>`,ar=`<div style="font-size:20px">${esc(w.e)}</div>`,pyl=`<div><b>${esc(w.p)}</b></div>`,tr=w.t!==w.s?`<div class="mut">${esc(w.t)}</div>`:'';
  const front=fo.dir==='h'?hz:fo.dir==='ph'?hz+`<div style="font-size:22px"><b>${esc(w.p)}</b></div>`:fo.dir==='p'?`<div style="font-size:36px;font-weight:600">${esc(w.p)}</div>`:`<div style="font-size:22px">${esc(w.e)}</div>`;

function skBuild(){sents=[];[...SENT_RAW.split('\n'),...skImp].forEach(ln=>{const f=ln.trim().split('|');if(f.length<4)return;
 const t=f[2].trim().split(/\s+/).map(x=>{const k=x.lastIndexOf('/');return{h:x.slice(0,k),p:x.slice(k+1)}}),e=f[3].trim(),j=t.map(x=>x.h).join('');
 sents.push({id:'k'+f[0]+'-'+j,l:+f[0]||1,pat:f[1].trim(),t,e,s:j+(/\?$/.test(e)?'？':/!$/.test(e)?'！':'。')})})}
function skNew(){const p=sents.filter(s=>(!sk.lv||s.l===sk.lv)&&(!sk.pat||s.pat===sk.pat));if(!p.length){sk.q=null;return}
 const o2=p.filter(s=>!sk.q||s.id!==sk.q.id),u=o2.filter(s=>!skDone.has(s.id)),a=u.length?u:o2.length?o2:p;
 sk.q=a[Math.random()*a.length|0];const t=sk.q.t;let o=t.map((_,i)=>i),n=0;
 do{o.sort(()=>Math.random()-.5)}while(n++<8&&o.every((v,i)=>t[v].h===t[i].h));
 sk.ord=o;sk.sl=t.map(()=>-1);sk.res='';sk.miss=0;sk.hint=0}
function skCheck(){const q=sk.q;if(sk.sl.includes(-1)){sk.res='';return}
 if(sk.sl.every((ti,j)=>q.t[ti].h===q.t[j].h)){sk.res='ok';if(!sk.miss&&!sk.hint){sk.streak++;if(!skDone.has(q.id)){skDone.add(q.id);store.set('sk_done',[...skDone])}}}
 else{sk.res='bad';sk.miss++;sk.streak=0}}
function skPut(ti,j){const s=sk.sl,from=s.indexOf(ti),prev=s[j];if(from>=0)s[from]=prev;s[j]=ti;skCheck()}
function skHint(){const q=sk.q;if(sk.res==='ok')return;sk.hint++;
 sk.sl=sk.sl.map((ti,j)=>ti>=0&&q.t[ti].h===q.t[j].h?ti:-1);const j=sk.sl.indexOf(-1);if(j<0)return;
 sk.sl[j]=sk.ord.find(i=>!sk.sl.includes(i)&&q.t[i].h===q.t[j].h);skCheck()}
const skTile=(w,i)=>`<button class="tile" draggable="true" data-skt="${i}" style="border-color:${LC[sk.q.l]}"><span class="th">${esc(w.h)}</span>${sk.py?`<span class="tp">${esc(w.p)}</span>`:''}</button>`;
function sent(){if(!sents.length)skBuild();if(!sk.q)skNew();
 const pats=[...new Set(sents.filter(s=>!sk.lv||s.l===sk.lv).map(s=>s.pat))],pool=sents.filter(s=>(!sk.lv||s.l===sk.lv)&&(!sk.pat||s.pat===sk.pat)),dn=pool.filter(s=>skDone.has(s.id)).length,q=sk.q;
 let h=`<div class="card row"><select id="skl"><option value="0">Semua level</option>${[1,2,3,4,5].map(l=>`<option value="${l}" ${sk.lv===l?'selected':''}>HSK ${l}</option>`).join('')}</select><select id="skp"><option value="">Semua pola</option>${pats.map(p=>`<option ${sk.pat===p?'selected':''}>${esc(p)}</option>`).join('')}</select><label><input type="checkbox" id="skpy" ${sk.py?'checked':''}> pinyin di kepingan</label></div><div class="mut" style="margin:-4px 0 8px">Dikuasai ${dn}/${pool.length} kalimat · beruntun ${sk.streak} 🔥 · ${sents.length} kalimat tersedia</div>`;
 if(!q)h+='<div class="card mut">Belum ada kalimat untuk filter ini.</div>';
 else{h+=`<div class="card"><div class="mut">Susun kepingan menjadi kalimat Mandarin (ketuk atau seret):</div><div style="font-size:19px;font-weight:600;margin:4px 0">${esc(q.e)}</div><div>${lvTag(q.l)}<span class="chip" style="font-size:12px;cursor:default">${esc(q.pat)}</span></div>
<div class="slots">${sk.sl.map((ti,j)=>{const w=ti>=0?q.t[ti]:null,bad=sk.res==='bad'&&w&&w.h!==q.t[j].h;return `<div class="slot ${w?'f ':''}${sk.res==='ok'?'ok':bad?'bad':''}" data-skj="${j}">${w?skTile(w,ti):`<span class="mut">${j+1}</span>`}</div>`}).join('')}</div>
<div class="tiles">${sk.ord.filter(i=>!sk.sl.includes(i)).map(i=>skTile(q.t[i],i)).join('')||'<span class="mut">Semua kepingan terpakai</span>'}</div>
${sk.res==='bad'?'<div style="color:var(--ac)">Belum tepat — ketuk kepingan bertanda merah untuk memperbaiki.</div>':''}
<div class="row" style="margin-top:10px"><button class="btn" data-ska="hint">💡 Petunjuk</button><button class="btn" data-ska="reset">↺ Ulang</button>${sk.res==='ok'?`<button class="btn" data-sp="${esc(q.s)}">🔊</button><button class="btn pri" data-ska="new">Berikutnya ›</button>`:'<button class="btn" data-ska="new">⏭ Lewati</button>'}</div></div>`;
 if(sk.res==='ok')h+=`<div class="card" style="border-color:var(--l2)"><b style="color:var(--l2)">✓ Benar!</b>${sk.miss||sk.hint?'':' Dikuasai ⭐'}<div class="hz" style="font-size:28px;margin:6px 0">${esc(q.s)}</div><div><b>${esc(q.t.map(x=>x.p).join(' '))}</b></div><div class="mut">${esc(q.e)}</div><div class="mut" style="margin-top:6px">Ketuk kata untuk membuka mind map-nya:</div><div>${q.t.map(x=>`<span class="chip" data-c="${[...x.h].find(c=>CJK.test(c))||''}">${esc(x.h.replace(/[，,]/g,''))}<small class="mut"> ${esc(x.p)}</small></span>`).join('')}</div></div>`}
 h+=`<div class="card"><b>Tambah kalimat</b><div class="mut">Satu baris per kalimat: <code>level|pola|hanzi/pinyin hanzi/pinyin …|arti</code>. Contoh: <code>1|S+V+O|我/wǒ 爱/ài 你/nǐ|Saya cinta kamu.</code></div><textarea id="skta" rows="4" style="width:100%;margin:6px 0"></textarea><div class="row"><button class="btn pri" id="skimp">Impor</button><button class="btn" id="skclr">Hapus hasil impor</button><span class="mut">${esc(sk.msg)}</span></div></div>`;
 app().innerHTML=h;const g=id=>document.getElementById(id);
 g('skl').onchange=e=>{sk.lv=+e.target.value;sk.pat='';sk.q=null;render()};
 g('skp').onchange=e=>{sk.pat=e.target.value;sk.q=null;render()};
 g('skpy').onchange=e=>{sk.py=e.target.checked;render()};
 g('skimp').onclick=()=>{let n=0;g('skta').value.split('\n').forEach(l=>{const f=l.trim().split('|');if(f.length>=4&&/^[1-5]$/.test(f[0])&&f[2].includes('/')){skImp.push(l.trim());n++}});store.set('sk_imp',skImp);skBuild();sk.msg=n+' kalimat ditambahkan';render()};
 g('skclr').onclick=()=>{if(confirm('Hapus semua kalimat hasil impor?')){skImp=[];store.set('sk_imp',[]);skBuild();sk.q=null;sk.msg='';render()}};
 document.querySelectorAll('.tile').forEach(t=>t.ondragstart=e=>e.dataTransfer.setData('text/plain',t.dataset.skt));
 document.querySelectorAll('.slot').forEach(s=>{s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();if(sk.res==='ok')return;const ti=parseInt(e.dataTransfer.getData('text/plain'));if(!isNaN(ti)){skPut(ti,+s.dataset.skj);render()}}})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-skt],[data-ska]');if(!b||tab!=='sent'||!sk.q)return;
 if(b.dataset.skt!==undefined){const ti=+b.dataset.skt,sj=b.closest('[data-skj]');
  if(sj){if(sk.res!=='ok'){sk.sl[+sj.dataset.skj]=-1;sk.res=''}}else{const j=sk.sl.indexOf(-1);if(j>=0)skPut(ti,j)}}
 else{const a=b.dataset.ska;if(a==='new'){if(sk.res!=='ok')sk.streak=0;skNew()}else if(a==='reset'){sk.sl=sk.sl.map(()=>-1);sk.res=''}else if(a==='hint')skHint()}
 render()});
build();render();
</script></body></html>
